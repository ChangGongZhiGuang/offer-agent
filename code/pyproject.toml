[project]
name = "interviewforge"
version = "0.0.0"
description = "AI mock interviewer agent harness"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rag = ["chromadb>=0.5"]
web = ["fastapi>=0.115,<0.116", "uvicorn[standard]>=0.30,<0.35", "httpx>=0.27,<0.29", "python-multipart>=0.0.9"]
mcp = ["mcp>=1.0,<2"]
resume = ["pypdf>=4.0", "python-docx>=1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interviewforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
